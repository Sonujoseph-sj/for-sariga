<!-- for-sariga/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F1">
  <meta name="description" content="A little chat, made only for Sariga.">
  <title>For Sariga 💗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock screen gate -->
  <div class="gate" id="gate">
    <div class="gate-clock" id="gateClock">00:00</div>
    <div class="gate-date" id="gateDate"></div>
    <button class="notif" id="openChat" type="button">
      <span class="notif-avatar" aria-hidden="true">S</span>
      <span class="notif-body">
        <span class="notif-name">Sonu 💗</span>
        <span class="notif-text">Sariga, I made something for you 🙈</span>
      </span>
    </button>
    <p class="gate-hint">Tap the message to open</p>
  </div>

  <div class="phone">
    <header class="chat-head">
      <span class="avatar" aria-hidden="true">S</span>
      <div class="who">
        <span class="who-name">Sonu 💗</span>
        <span class="who-status" id="status">online</span>
      </div>
      <span class="head-heart" aria-hidden="true">♥</span>
    </header>

    <main class="thread" id="thread" aria-live="polite"></main>

    <footer class="dock" id="dock"></footer>
  </div>

  <!-- Letter overlay -->
  <div class="letter-overlay" id="letterOverlay" hidden>
    <article class="paper" role="dialog" aria-modal="true" aria-label="Letter from Sonu">
      <div class="paper-text" id="letterText"></div>
      <button class="btn btn-yes" id="closeLetter" type="button">Fold the letter 💌</button>
    </article>
  </div>

  <div class="hearts-layer" id="hearts" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
